{{- if .Values.tags.mongo }}
# mongo root 密码自举化（决断 #16 零痕迹）：install 时现场生成、只落集群 Secret 不进 git
# （公开仓库看不到）。lookup 守卫 = 已存在即复用（upgrade 不轮换，auth 不断）——与 buildkit
# TLS 同款模式；helm template（无集群）每次渲染出新值属已知行为，真相以 install/upgrade 为准。
# 生成字符集只用字母+数字：mongodb:// 的 URI 拼接免转义（config.go 组拼，MONGO_URI 整串 env
# 仍可显式覆盖——外部 mongo / 本机调试走那条路）。
{{- $ns := .Release.Namespace }}
{{- $existing := lookup "v1" "Secret" $ns "mongo-auth" }}
{{- $pw := "" }}
{{- if $existing }}
  {{- $pw = index $existing.data "password" | b64dec }}
{{- else }}
  {{- $pw = printf "%s%s" (randAlpha 14) (randNumeric 10) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: mongo-auth
  namespace: {{ $ns }}
  labels:
    app: mini-pipeline
type: Opaque
data:
  password: {{ $pw | b64enc }}
{{- end }}

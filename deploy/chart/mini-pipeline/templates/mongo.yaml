{{- if .Values.tags.mongo }}
# 内置 MongoDB —— 从 deploy/mongo.yaml 收编而来（M0 的老资源由本 chart 接管，PVC 继续用）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO 本地卷（local-path）纪律：滚动会双 Pod 同节点共存抢 WiredTiger 锁（exit 100），
    # 新 Pod 起不来老 Pod 不退 = 死锁——spec 变更滚动前先杀老的（2026-11-10 upgrade 实录）
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          args: ["--bind_ip_all"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-auth   # templates/secret.yaml 现场生成（决断 #16 零痕迹，lookup 复用）
                  key: password
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:          # 让 helm --wait 有据可依
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.mongo | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.mongo.persistence.existingClaim | default "mongo-data" }}
---
# ClusterIP：只做内网服务发现，不再向公网开 NodePort（30017 已退役）
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
{{- if not .Values.mongo.persistence.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size }}
{{- end }}
{{- end }}
